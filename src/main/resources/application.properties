spring.application.name=smart-task-manager-backend
server.port=8080

# MySQL - database: smart_task_manager
spring.datasource.url=jdbc:mysql://localhost:3306/smart_task_manager?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT
app.jwt.secret=smart-task-manager-very-long-secret-key-256bits-minimum-xxxx-123456
app.jwt.expiration-ms=86400000
